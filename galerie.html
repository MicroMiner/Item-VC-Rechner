<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="VeloCity Minecraft-Server – unsere Welt, Neuigkeiten und Tools."
    />
    <title>VeloCity · Galerie</title>
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="assets/images/favicon.png"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/portal.css" />
  </head>
  <body class="site-page portal-page">
    <div class="wrap">
      <header class="site-header">
        <a
          class="site-logo"
          href="index.html"
          aria-label="VeloCity – Startseite"
          ><img
            src="assets/images/velocity-logo.png"
            alt="VeloCity"
            width="2171"
            height="724"
        /></a>
        <nav class="site-nav" aria-label="Hauptnavigation">
          <a class="nav-link" href="index.html">Startseite</a
          ><a class="nav-link" href="umrechner.html">Umrechner</a
          ><a class="nav-link" href="neuigkeiten.html">Neuigkeiten</a
          ><a class="nav-link" href="galerie.html" aria-current="page"
            >Galerie</a
          >
        </nav>
      </header>
      <main class="portal-main">
        <header class="portal-heading">
          <div class="brand">VELOCITY SERVER</div>
          <h1>Galerie</h1>
          <p>
            Entdecke unsere Minecraft-Welt, besondere Bauprojekte und
            unvergessliche Momente.
          </p>
        </header>
        <section
          id="galleryGrid"
          class="gallery-grid"
          aria-label="Minecraft-Screenshots"
          aria-busy="true"
        >
          <p class="muted">Galerie wird geladen …</p>
        </section>
        <p id="galleryStatus" class="portal-message" role="status"></p>
        <noscript
          ><p>
            Bitte JavaScript aktivieren, um die Galerie zu laden.
          </p></noscript
        >
      </main>
      <footer class="foot">
        <span>© 2026 VeloCity</span><span aria-hidden="true">·</span
        ><span
          >Developed by
          <strong class="developer-credit">MicroMiner</strong></span
        ><span aria-hidden="true">·</span
        ><a href="#impressum" id="openImpressum" aria-haspopup="dialog"
          >Impressum</a
        >
      </footer>
    </div>
    <dialog
      id="impressum"
      class="legal-dialog"
      aria-labelledby="impressumTitle"
    ></dialog>
    <dialog
      id="galleryDialog"
      class="gallery-dialog"
      aria-labelledby="galleryTitle"
    >
      <button
        id="galleryClose"
        class="btn gallery-close"
        type="button"
        aria-label="Bildansicht schliessen"
        autofocus
      >
        ×
      </button>
      <figure>
        <img id="galleryFullImage" alt="" width="1920" height="1017" />
        <figcaption>
          <h2 id="galleryTitle"></h2>
          <p id="galleryDescription"></p>
        </figcaption>
      </figure>
      <div class="gallery-controls">
        <button
          id="galleryPrevious"
          class="btn"
          type="button"
          aria-label="Vorheriges Bild"
        >
          ←</button
        ><span id="galleryPosition" role="status" aria-live="polite"></span
        ><button
          id="galleryNext"
          class="btn"
          type="button"
          aria-label="Nächstes Bild"
        >
          →
        </button>
      </div>
      <p id="galleryImageStatus" role="status"></p>
    </dialog>
    <script src="assets/js/ui.js?v=legal-2" defer></script>
    <script src="assets/js/gallery.js" type="module"></script>
  </body>
</html>
