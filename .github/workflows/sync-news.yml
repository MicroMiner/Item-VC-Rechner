name: Sync VeloCity Discord news

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: velocity-news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.DISCORD_CHANNEL_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch Discord updates
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: node scripts/sync-discord.mjs
      - name: Commit changed news JSON
        run: |
          if git diff --quiet -- assets/data/updates.json; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/updates.json
          git commit -m "chore: sync Discord news"
          git push

# Deployment note:
# When Pages uses a branch as its source, commits created by GITHUB_TOKEN
# do not trigger a Pages build. Switch Pages source to GitHub Actions and
# create a separate pages deployment workflow, or add a deploy job here.
