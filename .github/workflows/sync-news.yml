name: Sync and publish VeloCity news

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: velocity-pages
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch Discord updates
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$DISCORD_CHANNEL_ID" ]; then
            echo "::error::Configure DISCORD_BOT_TOKEN (secret) and DISCORD_CHANNEL_ID (variable)."
            exit 1
          fi
          node scripts/sync-discord.mjs
      - name: Commit changed news JSON
        run: |
          if git diff --quiet -- assets/data/updates.json; then
            echo "No news changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/updates.json
            git commit -m "chore: sync Discord news"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

# REQUIRED setup in repository Settings > Pages:
# Set Build and deployment > Source to "GitHub Actions".
# Existing static HTML/CSS/JS pages continue to work without a build step.
